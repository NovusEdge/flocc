[project]
name = "flocc"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
flocc = "flocc.cli:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.13"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs", ".superpowers"]

[tool.pyrefly]
search-path = [".", "src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pyrefly==1.3.2", "pytest>=9.1.1", "ruff==0.16.10"]
