team_key = "NF"
trigger_label = "claude"
state_root = "~/.local/state/flocc"
ledger_path = "~/.local/state/flocc/ledger.sqlite"
linear_key_file = "~/.config/flocc/linear.key"
agent_gh_token_file = "~/.config/flocc/gh-agent.token"
publish_gh_token_file = "~/.config/flocc/gh-publish.token"
digest_issue = "NF-1"
check_timeout_s = 1800
# Longest a check waits for memory before its claim blocks as check-waiting-memory; default is
# twice check_timeout_s.
# check_wait_s = 3600
setup_timeout_s = 900
# New starts are held while the disk holding worktree_root has less free space than this.
# min_free_disk_gb = 2.0
# Starts and relaunches wait, and cardinal is told, while /tmp is fuller than this percent or
# memory available is below this many GiB.
# tmp_max_pct = 80.0
# min_available_mem_gb = 1.0
# Keep one uv cache under worktree_root across every ./setup, so later setups link packages
# instead of downloading them. Leave off on small disks: the cache is never pruned.
# shared_uv_cache = true
# Agent commits carry a "Flocc: KEY phase" trailer; set false to leave it off.
# commit_trailer = false
# For hosts that share a Linear team and map only some of its repos: leave issues matching no
# mapped repo alone instead of commenting that no repo matches.
# skip_unmapped = true
# cardinal's file verb records follow-up drafts in the digest; true creates them in Backlog.
# cardinal_file_on = false
# Linear user or bot/app ids (not names) whose comments on a running issue are typed into the
# live session like the owner's, so another agent can steer. Empty forwards only the owner's.
# steer_authors = ["your-hermes-linear-id"]
# GitHub logins whose "/flocc ..." comments or reviews on a done issue's open PR start a comment
# fix, like a Linear comment. Bots are ignored. Empty turns the GitHub scan off.
# github_steer_logins = ["your-github-login"]
# Fix sessions your comments, or a steer_authors id's, may start on a done issue whose PR is
# still open, per run. They push to the PR with no new review; 0 turns them off.
# comment_fix_max = 3
# Most concurrent sessions this host runs. A claim in its background check still counts.
# session_cap = 2
# Admission stops starting issues once sessions have used this share of each usage window.
# five_hour_max_pct = 80.0
# weekly_max_pct = 80.0
# 0-23; hour the daily digest posts.
# digest_hour = 18
# Per-session wall-clock stop, in seconds.
# default_wall_clock_s = 10800
# Review phase wall-clock stop, in seconds.
# review_wall_clock_s = 3600
# Fix sessions a failed check gets before the claim blocks.
# check_fix_rounds = 2
# review_model = "opus"
# Per-phase reasoning effort (low|medium|high|xhigh|max); an issue's agentblock effort overrides.
# tester_effort = "high"
# impl_effort = "medium"
# review_effort = "medium"

[repos.backend]
path = "~/src/backend"
base_branch = "main"
# Private repos of a GitHub Free organization cannot have draft PRs; set false there.
# draft = false
# Overrides the top-level commit_trailer for this repo.
# commit_trailer = false
# A check for this repo starts only with this many GiB of MemAvailable. MemAvailable counts page
# cache as available, so set this to the check's anon peak plus min_available_mem_gb, not its
# total peak: 4.5 suits a heavy repo like nimblefox (2.4 GB anon). Until then the check waits for
# a later tick, and the claim blocks as check-waiting-memory after check_wait_s.
# check_min_mem_gb = 2.0
# Memory limits of the check's systemd unit. Max counts page cache, so keep it above the check's
# total peak (nimblefox: 5.0 GB). With swap on, a check past Max goes to swap, shared by every
# session, and dies only when SwapMax is full too.
# check_memory_max = "6G"
# check_memory_swap_max = "1G"

[mcp_servers.sentry]
type = "http"
url = "https://mcp.sentry.dev/mcp"
