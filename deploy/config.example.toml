team_key = "NF"
trigger_label = "claude"
state_root = "~/.local/state/linear-agents"
worktree_root = "~/agents/worktrees"
plugin_dir = "~/agents/linear-agents/plugin"
ledger_path = "~/.local/state/linear-agents/ledger.sqlite"
linear_key_file = "~/.config/linear-agents/linear.key"
agent_gh_token_file = "~/.config/linear-agents/gh-agent.token"
publish_gh_token_file = "~/.config/linear-agents/gh-publish.token"
ntfy_url = "https://ntfy.sh/replace-with-a-long-random-topic"
digest_issue = "NF-1"
check_timeout_s = 1800
setup_timeout_s = 900
# New starts are held while the disk holding worktree_root has less free space than this.
# min_free_disk_gb = 2.0
# Agent commits carry a "Linear-Agents: KEY phase" trailer; set false to leave it off.
# commit_trailer = false
# For hosts that share a Linear team and map only some of its repos: leave issues matching no
# mapped repo alone instead of commenting that no repo matches.
# skip_unmapped = true
# Linear user or bot/app ids (not names) whose comments on a running issue are typed into the
# live session like the owner's, so another agent can steer. Empty forwards only the owner's.
# steer_authors = ["your-hermes-linear-id"]
# Admission stops starting issues once sessions have used this share of each usage window.
# five_hour_max_pct = 80.0
# weekly_max_pct = 80.0
# Per-phase reasoning effort (low|medium|high|xhigh|max); an issue's agentblock effort overrides.
# tester_effort = "high"
# impl_effort = "medium"
# review_effort = "medium"

[repos.backend]
path = "~/src/backend"
base_branch = "main"
# Private repos of a GitHub Free organization cannot have draft PRs; set false there.
# draft = false
# Overrides the top-level commit_trailer for this repo.
# commit_trailer = false

[mcp_servers.sentry]
type = "http"
url = "https://mcp.sentry.dev/mcp"
